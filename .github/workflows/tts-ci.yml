# CI for the TTS engines (engines/tts/ — moved from tts-cpp/ by the repo
# reorg QIP, PR 1).
#
# Scope (QIP "PR 0" lane): build chatterbox + supertonic + lavasr and every
# test harness against system ggml (qvac-ext-ggml @ speech — mandatory here:
# TTS_CPP_USE_SYSTEM_GGML defaults ON and the bundled path is rejected in
# this tree), then run the non-GPU ctest suites (fixture-free tests and the
# ones with committed fixtures pass; model-dependent ones auto-DISABLE to
# "Not Run").
# The macOS lane runs on self-hosted Apple silicon with a Metal ggml and
# additionally enforces test-metal-ops, the fixture-free Metal kernel parity
# suite. Vulkan/CUDA suites need real GPUs → self-hosted lane, see the gpu
# job stub at the bottom.
name: tts CI

on:
  push:
    branches: [master]
    paths:
      - 'engines/tts/**'
      - '.github/workflows/tts-ci.yml'
  pull_request:
    paths:
      - 'engines/tts/**'
      - '.github/workflows/tts-ci.yml'
  workflow_dispatch:
    inputs:
      run_gpu:
        description: 'Also run the GPU ctest lane (on the self-hosted NVIDIA Linux runner)'
        type: boolean
        default: false

permissions:
  contents: read

# Dedupe per PR and per branch: a re-push or re-dispatch supersedes the
# in-flight run. The guard below previously excluded every event but
# pull_request, so a push or a re-dispatch stacked a second run instead of
# replacing the first.
#
# Two things are exempt and keyed per run instead, so they can never be
# superseded:
#
#   run_gpu dispatch - the opt-in `gpu` job below only runs under a
#     workflow_dispatch with run_gpu, takes ~90 minutes on a self-hosted
#     runner, and is SKIPPED by whatever run would replace it. Since that
#     dispatch is made on a branch rather than master, keying on the ref alone
#     left it cancellable — a second dispatch would kill it and the
#     replacement would not re-run `gpu`, silently losing the result.
#   master - so a merged commit always gets a CI verdict.
#
# github.event.inputs.* is a string even for a `type: boolean` input, hence
# the explicit == 'true'.
concurrency:
  group: tts-ci-${{ ((github.event.inputs.run_gpu == 'true' || github.ref == 'refs/heads/master') && github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  GGML_REPO: https://github.com/tetherto/qvac-ext-ggml.git
  GGML_BRANCH: speech # single ggml pin shared with parakeet-ci.yml

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  authorize:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-authorize-self-hosted.yml

  build-test:
    needs: runner_names
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          # Same host with tinyBLAS (GGML_LLAMAFILE) compiled into ggml, the
          # configuration the ggml-speech port ships for Linux x64: exercises
          # the tinyBLAS-aware CPU tolerance in the Parler parity tests and
          # asserts the feature detection sees it (test-backend-features).
          - os: ubuntu-24.04
            llamafile: ON
    # Hosted only. The self-hosted lane is `build-test-macos`, which carries the
    # fork-ci gate; a job-level `if` cannot see `matrix.os`, so a row here could
    # not be gated.
    runs-on: ${{ needs.runner_names.outputs.ubuntu_2404 }}
    name: build-test (${{ matrix.os }}${{ matrix.llamafile == 'ON' && ', tinyBLAS' || '' }})
    timeout-minutes: 60
    steps:
      # Self-hosted runners are persistent, so a previous run's tree can
      # survive into this one (docs/ci/SELF-HOSTED-RUNNERS.md in the qvac
      # monorepo).
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - uses: actions/checkout@v4

      - name: Install ccache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else sudo apt-get update -q && sudo apt-get install -y ccache; fi
          fi
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      - name: Resolve ggml pin (tip of ${{ env.GGML_BRANCH }})
        id: ggml
        run: echo "sha=$(git ls-remote "$GGML_REPO" "refs/heads/$GGML_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache ggml install
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-install
          # Linux stays compatible with the portable cache shared with
          # parakeet-ci.yml. macOS carries the Metal backend that
          # test-metal-ops needs (same split as audiogen-ci.yml).
          key: ggml-install-${{ runner.os == 'macOS' && 'metal' || 'portable' }}${{ matrix.llamafile == 'ON' && '-llamafile' || '' }}-${{ matrix.os }}-${{ steps.ggml.outputs.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-tts-${{ matrix.os }}${{ matrix.llamafile == 'ON' && '-llamafile' || '' }}-${{ github.sha }}
          restore-keys: ccache-tts-${{ matrix.os }}${{ matrix.llamafile == 'ON' && '-llamafile' || '' }}-

      # Linux builds a portable CPU-only ggml (hosted runner, no GPU).
      # macOS builds with Metal: the self-hosted runner is real Apple
      # silicon, unlike hosted macos-14 whose Apple Paravirtual device has
      # no simdgroup matmul and aborts Metal-touching tests at kernel
      # encode (QVAC-22775).
      - name: Build ggml (system ggml, qvac-ext-ggml@${{ env.GGML_BRANCH }})
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          # Fetch the exact SHA the cache key was derived from — the branch
          # tip may have advanced since the ls-remote resolution, and a
          # tip-only shallow clone would then silently build (and cache)
          # a different commit than the key claims.
          git init -q ggml-src
          git -C ggml-src remote add origin "$GGML_REPO"
          git -C ggml-src fetch --depth 1 origin ${{ steps.ggml.outputs.sha }}
          git -C ggml-src checkout -q FETCH_HEAD
          cmake -S ggml-src -B ggml-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=${{ runner.os == 'macOS' && 'ON' || 'OFF' }} \
            -DGGML_LLAMAFILE=${{ matrix.llamafile == 'ON' && 'ON' || 'OFF' }} \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j4
          cmake --install ggml-src/build

      # TTS_CPP_COREML on macOS: the Apple lane builds the Core ML Audio8
      # codec sidecar wrapper and runs the parity test against a converted
      # decoder GGUF + exported sidecar (see the "Core ML Audio8 fixture"
      # steps below), so the feature is functionally covered on every PR, not
      # just compiled.
      - name: Configure
        run: |
          cmake -S engines/tts -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTTS_CPP_BUILD_TESTS=ON \
            ${{ runner.os == 'macOS' && '-DTTS_CPP_COREML=ON' || '' }} \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"

      - name: Build
        run: cmake --build build -j4

      # Excludes gpu (no usable GPU on hosted runners — see the ggml build
      # note) and perf (timing gates are meaningless on shared runners).
      # Model-dependent tests are DISABLED at configure time when fixtures
      # are absent and report as "Not Run".
      # LD_LIBRARY_PATH: the ggml install ships libqvac-speech-ggml.so whose
      # own dependency on the ggml-cpu/base siblings is resolved transitively
      # — Linux RUNPATH doesn't apply to transitive loads, so the loader
      # needs the directory explicitly (macOS @rpath chains handle it).
      - name: Test (non-GPU)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: ctest --test-dir build -LE 'gpu|perf' --output-on-failure --timeout 600

  # Self-hosted Apple silicon, not hosted macOS: hosted macos-14 exposes an
  # Apple Paravirtual device without simdgroup matmul, so Metal-touching tests
  # abort at kernel encode (QVAC-22775). Job-level `if` cannot see `matrix.os`,
  # so this lane is a separate job gated on fork-ci.
  build-test-macos:
    needs: [runner_names, authorize]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
    timeout-minutes: 60
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .

      - uses: actions/checkout@v4

      - name: Install ccache
        run: echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      - name: Resolve ggml pin (tip of ${{ env.GGML_BRANCH }})
        id: ggml
        run: echo "sha=$(git ls-remote "$GGML_REPO" "refs/heads/$GGML_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache ggml install
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-install
          key: ggml-install-metal-macos-26-${{ steps.ggml.outputs.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-tts-macos-26-${{ github.sha }}
          restore-keys: ccache-tts-macos-26-

      - name: Build ggml (system ggml, qvac-ext-ggml@${{ env.GGML_BRANCH }})
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          git init -q ggml-src
          git -C ggml-src remote add origin "$GGML_REPO"
          git -C ggml-src fetch --depth 1 origin ${{ steps.ggml.outputs.sha }}
          git -C ggml-src checkout -q FETCH_HEAD
          cmake -S ggml-src -B ggml-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=ON \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j4
          cmake --install ggml-src/build

      - name: Configure
        run: |
          cmake -S engines/tts -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTTS_CPP_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"

      - name: Build
        run: cmake --build build -j4

      - name: Test (non-GPU)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: ctest --test-dir build -LE 'gpu|perf' --output-on-failure --timeout 600

      - name: Test (Metal kernel parity)
        run: |
          set -o pipefail
          ctest --test-dir build -R '^test-metal-ops$' --no-tests=error -V --timeout 600 2>&1 | tee metal-test.log
          if grep -q "No Metal device registered" metal-test.log; then
            echo "::error::Metal backend absent on the Apple-silicon runner — the parity suite never ran"
            exit 1
          fi

      # Core ML Audio8 codec sidecar fixtures, converted and exported by the
      # repo's own scripts: the 64-frame sidecar for parity and speed, and an
      # 8-frame one (window <= causal context) that loads but cannot serve, for
      # the fallback regression. Cache key: checkpoint revision + script hashes.
      - name: Cache Core ML Audio8 fixture
        if: runner.os == 'macOS'
        id: audio8-coreml-cache
        uses: actions/cache@v4
        with:
          path: |
            audio8-coreml-fixture
            audio8-coreml-fixture-fallback
          key: audio8-codec-coreml-${{ runner.os }}-${{ runner.arch }}-f07040f3-${{ hashFiles('engines/tts/scripts/export-audio8-codec-coreml.py', 'engines/tts/scripts/convert-audio8-codec-to-gguf.py', 'engines/tts/scripts/audio8_reference.py', 'engines/tts/test/test_export_audio8_codec_coreml.py', 'engines/parakeet/scripts/requirements-coreml.txt') }}

      - name: Build Core ML Audio8 fixture
        if: runner.os == 'macOS' && steps.audio8-coreml-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p audio8-coreml-fixture audio8-coreml-fixture-fallback audio8-checkpoint
          for f in config.json codec.pth; do
            curl -sSfL --retry 3 -o "audio8-checkpoint/$f" \
              "https://huggingface.co/Audio8/Audio8-TTS-Preview-0.6b/resolve/f07040f3d151f1ba0253bfb92cb2f5dd38b44594/$f"
          done
          echo "c310505aa11fe2f6cc63b8d3130dc7e77e73227774f5c62575769b1f47a8d048  audio8-checkpoint/codec.pth" | shasum -a 256 -c -
          coreml_python="$(command -v python3.11 || command -v python3)"
          "$coreml_python" -m venv .venv-coreml
          .venv-coreml/bin/python -m pip install --upgrade pip
          .venv-coreml/bin/python -m pip install -r engines/parakeet/scripts/requirements-coreml.txt
          .venv-coreml/bin/python engines/tts/test/test_export_audio8_codec_coreml.py
          .venv-coreml/bin/python engines/tts/scripts/convert-audio8-codec-to-gguf.py \
            --model-dir audio8-checkpoint --part decoder \
            --outfile audio8-coreml-fixture/audio8-codec-decoder-f16.gguf --dtype f16
          .venv-coreml/bin/python engines/tts/scripts/export-audio8-codec-coreml.py \
            --gguf audio8-coreml-fixture/audio8-codec-decoder-f16.gguf \
            --compile-dir audio8-coreml-fixture
          ln -sf "$GITHUB_WORKSPACE/audio8-coreml-fixture/audio8-codec-decoder-f16.gguf" \
            audio8-coreml-fixture-fallback/audio8-codec-decoder-f16.gguf
          .venv-coreml/bin/python engines/tts/scripts/export-audio8-codec-coreml.py \
            --gguf audio8-coreml-fixture-fallback/audio8-codec-decoder-f16.gguf --window 8 \
            --out audio8-coreml-fixture-fallback/audio8-codec-decoder.mlpackage \
            --compile-dir audio8-coreml-fixture-fallback
          rm -rf audio8-coreml-fixture/audio8-codec-decoder.mlpackage \
            audio8-coreml-fixture-fallback/audio8-codec-decoder.mlpackage audio8-checkpoint

      # Runs the binary directly: a skip (exit 77) fails the step, so a green
      # lane proves the parity assertions ran against the staged sidecar.
      - name: Test (Core ML Audio8 codec sidecar)
        if: runner.os == 'macOS'
        env:
          AUDIO8_COREML_TEST_MODELS_DIR: ${{ github.workspace }}/audio8-coreml-fixture
          AUDIO8_COREML_FALLBACK_MODELS_DIR: ${{ github.workspace }}/audio8-coreml-fixture-fallback
        run: |
          # The fallback fixture links the GGUF by absolute path; a restored
          # cache keeps the link, so re-point it in case the workspace moved.
          ln -sf "$GITHUB_WORKSPACE/audio8-coreml-fixture/audio8-codec-decoder-f16.gguf" \
            audio8-coreml-fixture-fallback/audio8-codec-decoder-f16.gguf
          ./build/test-audio8-codec-coreml-parity

      # Synthesis benchmark, ggml Metal vs the Core ML sidecar on the runner;
      # the markdown table lands in the job summary. The binary fails on
      # parity below the gate, so the numbers are gated, not decorative.
      - name: Benchmark (Core ML Audio8 codec vs Metal)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          AUDIO8_COREML_TEST_MODELS_DIR="$GITHUB_WORKSPACE/audio8-coreml-fixture" \
            ./build/bench-audio8-codec-coreml >> "$GITHUB_STEP_SUMMARY"

      # Core ML Supertonic vocoder fixture, converted and exported by the
      # repo's own scripts: the f16 GGUF plus the compiled 64-frame sidecar,
      # and the exporter's causal-context value (context.txt) for the
      # cross-check against the C++ computation. Cache key: script hashes
      # (the upstream Supertone/supertonic-2 bundle is unpinned; a model
      # revision change reuses the cache until a script changes).
      - name: Cache Core ML Supertonic fixture
        if: runner.os == 'macOS'
        id: supertonic-coreml-cache
        uses: actions/cache@v4
        with:
          path: supertonic-coreml-fixture
          key: supertonic-coreml-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engines/tts/scripts/export-supertonic-coreml.py', 'engines/tts/scripts/supertonic_coreml_gguf.py', 'engines/tts/scripts/convert-supertonic2-to-gguf.py', 'engines/tts/test/test_export_supertonic_coreml.py', 'engines/parakeet/scripts/requirements-coreml.txt') }}

      - name: Build Core ML Supertonic fixture
        if: runner.os == 'macOS' && steps.supertonic-coreml-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p supertonic-coreml-fixture
          if [ ! -x .venv-coreml/bin/python ]; then
            coreml_python="$(command -v python3.11 || command -v python3)"
            "$coreml_python" -m venv .venv-coreml
            .venv-coreml/bin/python -m pip install --upgrade pip
            .venv-coreml/bin/python -m pip install -r engines/parakeet/scripts/requirements-coreml.txt
          fi
          # onnx 1.17 is the last release without the ml_dtypes dependency,
          # whose current releases force numpy >= 2 and break coremltools'
          # TorchScript conversion; the constraints file pins the rest of the
          # stack, and the assert fails fast if a future resolution moves it.
          .venv-coreml/bin/python -m pip install \
            -c engines/parakeet/scripts/requirements-coreml.txt \
            "onnx==1.17.0" huggingface_hub
          .venv-coreml/bin/python -c 'import numpy; assert numpy.__version__ == "1.26.4", numpy.__version__'
          .venv-coreml/bin/python engines/tts/test/test_export_supertonic_coreml.py
          .venv-coreml/bin/python engines/tts/scripts/convert-supertonic2-to-gguf.py \
            --arch supertonic2 --ftype f16 \
            --out supertonic-coreml-fixture/supertonic2-f16.gguf
          .venv-coreml/bin/python engines/tts/scripts/export-supertonic-coreml.py \
            --gguf supertonic-coreml-fixture/supertonic2-f16.gguf \
            --compile-dir supertonic-coreml-fixture | tee supertonic-export.log
          grep -oE 'context=[0-9]+' supertonic-export.log | head -1 | cut -d= -f2 \
            > supertonic-coreml-fixture/context.txt
          rm -rf supertonic-coreml-fixture/supertonic2-vocoder.mlpackage supertonic-export.log

      # Runs the binary directly: a skip (exit 77) fails the step, so a green
      # lane proves the parity, fallback, strict, and warm-up assertions ran
      # against the staged sidecar. The context check pins the C++
      # receptive-field computation (supertonic_coreml_vocoder_context_frames)
      # to the exporter's (receptive_field_frames): a drift between the two
      # would corrupt audio at window seams.
      - name: Test (Core ML Supertonic vocoder sidecar)
        if: runner.os == 'macOS'
        env:
          SUPERTONIC_COREML_TEST_MODELS_DIR: ${{ github.workspace }}/supertonic-coreml-fixture
        run: |
          set -o pipefail
          ./build/test-supertonic-coreml-parity 2>&1 | tee supertonic-parity.log
          exporter_context="$(cat supertonic-coreml-fixture/context.txt)"
          runtime_context="$(grep -oE 'context=[0-9]+' supertonic-parity.log | head -1 | cut -d= -f2)"
          if [ "$exporter_context" != "$runtime_context" ]; then
            echo "::error::causal-context mismatch: exporter computed $exporter_context latent frames, the runtime computed $runtime_context"
            exit 1
          fi

  # GPU lane stub: opt-in until self-hosted GPU runners exist. Trial outcome
  # (QVAC-22775): hosted macos-14 exposes Metal but its Apple Paravirtual
  # device has no simdgroup matmul — kernel encode aborts with "unsupported
  # op 'MUL_MAT'" — so the gpu label needs real Apple silicon, not hosted
  # macOS.
  gpu:
    needs: runner_names
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    # qvac-ubuntu2204-x64-gpu is the NVIDIA Linux runner the qvac monorepo's
    # benchmark and e2e lanes use (it exposes nvidia-smi there). The generic
    # [self-hosted, gpu] label resolved to an Apple Silicon host with no CUDA
    # toolkit, which cannot run the CUDA arms this lane exists for.
    runs-on: ${{ needs.runner_names.outputs.linux_x64_gpu }}
    timeout-minutes: 90
    steps:
      # Self-hosted runners are persistent, so the previous job's tree can
      # survive into this one (docs/ci/SELF-HOSTED-RUNNERS.md in the qvac
      # monorepo). This job is self-hosted-only, so no hosted-runner guard.
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
      - uses: actions/checkout@v4
      - name: Show what this runner has
        run: |
          uname -a
          nvidia-smi || echo "no NVIDIA driver"
          command -v nvcc && nvcc --version || echo "no CUDA toolkit on PATH"
          ls /usr/local/cuda*/bin/nvcc 2>/dev/null || echo "no /usr/local/cuda*"
          command -v vulkaninfo && vulkaninfo --summary 2>/dev/null | head -20 || echo "no vulkaninfo"
      # GGML_VULKAN=ON is the backend the -L gpu suites primarily target
      # (test_vk_vs_cpu et al); Metal is on by default on Apple hosts.
      # CUDA is added only where a toolkit exists: this label currently
      # resolves to an Apple Silicon host, where requesting it fails the
      # configure outright. The per-backend arms pin the backend they cover
      # via TTS_CPP_GPU_BACKEND, so a host carrying several stays unambiguous.
      # A CPU-only ggml would skip or falsely pass the GPU suites.
      - name: Build ggml + engine (native backends) and run GPU suites
        run: |
          git clone --depth 1 --branch "$GGML_BRANCH" "$GGML_REPO" ggml-src
          CUDA_OPTION=""
          if command -v nvcc >/dev/null 2>&1 || [ -x /usr/local/cuda/bin/nvcc ]; then
            NVCC_PATH=$(command -v nvcc || echo /usr/local/cuda/bin/nvcc)
            CUDA_OPTION="-DGGML_CUDA=ON -DCMAKE_CUDA_COMPILER=$NVCC_PATH"
            echo "CUDA toolkit found at $NVCC_PATH; building the NVIDIA backend as well"
          else
            echo "::notice::no CUDA toolkit on this runner; the CUDA arms cannot run here"
          fi
          # GGML_BUILD_TESTS=OFF as every other ggml build in this repo does:
          # this lane runs the *engine's* ctest suite, never ggml's, so
          # compiling ggml's tests only spends runner time and couples the
          # lane to breakage in code it does not exercise.
          cmake -S ggml-src -B ggml-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_VULKAN=ON \
            $CUDA_OPTION \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j && cmake --install ggml-src/build
          cmake -S engines/tts -B build -DCMAKE_BUILD_TYPE=Release \
            -DTTS_CPP_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"
          cmake --build build -j
      # A fixture-less arm registers DISABLED, so `ctest -L gpu` reports success
      # having run none of them. Name the arms this lane exists to run and say
      # which could not, rather than reporting a bare pass. Reported rather than
      # enforced: no engine's fixtures are available to CI today -- Audio8's and
      # Parler's GPU arms are equally disabled -- so hosting them is a change
      # for the whole repo to make, not for this lane to block on.
      - name: Report which GPU arms are runnable
        run: |
          python3 - <<'CHECK'
          import json, subprocess, sys

          EXPECTED = [
              "test-s3gen-cuda",
              "test-s3gen-vulkan",
              "test-chatterbox-parity-mtl-cuda",
              "test-chatterbox-parity-mtl-vulkan",
          ]

          listing = subprocess.run(
              ["ctest", "--test-dir", "build", "-N", "--show-only=json-v1"],
              capture_output=True, text=True, check=True).stdout
          tests = json.loads(listing)["tests"]

          disabled = {}
          for test in tests:
              properties = {p["name"]: p["value"] for p in test.get("properties", [])}
              disabled[test["name"]] = bool(properties.get("DISABLED"))

          absent = [name for name in EXPECTED if name not in disabled]
          skipped = [name for name in EXPECTED if disabled.get(name)]
          if not absent and not skipped:
              print("all %d GPU arms are runnable" % len(EXPECTED))
              sys.exit(0)

          for name in absent:
              print("::warning::%s is not registered (its backend was not compiled)" % name)
          for name in skipped:
              print("::warning::%s is disabled (its model or reference dump is missing)" % name)
          print("")
          print("These arms did not run. Staging the fixtures and pointing the build")
          print("at them with -DTTS_CPP_TEST_MODEL_DIR and -DTTS_CPP_TEST_REF_DIR")
          print("would enable them:")
          print("  chatterbox-s3gen.gguf       ~1.0 GB   test-s3gen-*")
          print("  chatterbox-s3gen-mtl.gguf   ~1.0 GB   test-chatterbox-parity-mtl-*")
          print("  chatterbox-t3-mtl.gguf      ~330 MB   test-chatterbox-parity-mtl-*")
          print("  artifacts/s3gen-ref/        ~121 MB   test-s3gen-* (dump-s3gen-reference.py)")
          sys.exit(0)
          CHECK

      - name: Run the GPU suites
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: |
          ctest --test-dir build -L gpu --output-on-failure --timeout 1200

