# CI for the TTS engines (engines/tts/ — moved from tts-cpp/ by the repo
# reorg QIP, PR 1).
#
# Scope (QIP "PR 0" lane): build chatterbox + supertonic + lavasr and every
# test harness against system ggml (qvac-ext-ggml @ speech — mandatory here:
# TTS_CPP_USE_SYSTEM_GGML defaults ON and the bundled path is rejected in
# this tree), then run the non-GPU ctest suites (fixture-free tests and the
# ones with committed fixtures pass; model-dependent ones auto-DISABLE to
# "Not Run").
# The macOS lane runs on self-hosted Apple silicon with a Metal ggml and
# additionally enforces test-metal-ops, the fixture-free Metal kernel parity
# suite. Vulkan/CUDA suites need real GPUs → self-hosted lane, see the gpu
# job stub at the bottom.
name: tts CI

on:
  push:
    branches: [master]
    paths:
      - 'engines/tts/**'
      - '.github/workflows/tts-ci.yml'
  pull_request:
    paths:
      - 'engines/tts/**'
      - '.github/workflows/tts-ci.yml'
  workflow_dispatch:
    inputs:
      run_gpu:
        description: 'Also run the GPU ctest lane (on the self-hosted NVIDIA Linux runner)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tts-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GGML_REPO: https://github.com/tetherto/qvac-ext-ggml.git
  GGML_BRANCH: speech # single ggml pin shared with parakeet-ci.yml

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  build-test:
    needs: runner_names
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          # Self-hosted Apple silicon, not hosted macOS: hosted macos-14
          # exposes an Apple Paravirtual device without simdgroup matmul, so
          # Metal-touching tests abort at kernel encode (QVAC-22775). This is
          # the runner audiogen-ci.yml already uses for its enforced Metal
          # parity step; here it additionally unlocks test-metal-ops, the
          # fixture-free TTS Metal kernel parity suite.
          - os: macos-26
    runs-on: ${{ matrix.os == 'macos-26' && needs.runner_names.outputs.macos_arm64_gpu || needs.runner_names.outputs.ubuntu_2404 }}
    timeout-minutes: 60
    steps:
      # Self-hosted runners are persistent, so a previous run's tree can
      # survive into this one (docs/ci/SELF-HOSTED-RUNNERS.md in the qvac
      # monorepo).
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - uses: actions/checkout@v4

      - name: Install ccache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else sudo apt-get update -q && sudo apt-get install -y ccache; fi
          fi
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      - name: Resolve ggml pin (tip of ${{ env.GGML_BRANCH }})
        id: ggml
        run: echo "sha=$(git ls-remote "$GGML_REPO" "refs/heads/$GGML_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache ggml install
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-install
          # Linux stays compatible with the portable cache shared with
          # parakeet-ci.yml. macOS carries the Metal backend that
          # test-metal-ops needs (same split as audiogen-ci.yml).
          key: ggml-install-${{ runner.os == 'macOS' && 'metal' || 'portable' }}-${{ matrix.os }}-${{ steps.ggml.outputs.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-tts-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-tts-${{ matrix.os }}-

      # Linux builds a portable CPU-only ggml (hosted runner, no GPU).
      # macOS builds with Metal: the self-hosted runner is real Apple
      # silicon, unlike hosted macos-14 whose Apple Paravirtual device has
      # no simdgroup matmul and aborts Metal-touching tests at kernel
      # encode (QVAC-22775).
      - name: Build ggml (system ggml, qvac-ext-ggml@${{ env.GGML_BRANCH }})
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          # Fetch the exact SHA the cache key was derived from — the branch
          # tip may have advanced since the ls-remote resolution, and a
          # tip-only shallow clone would then silently build (and cache)
          # a different commit than the key claims.
          git init -q ggml-src
          git -C ggml-src remote add origin "$GGML_REPO"
          git -C ggml-src fetch --depth 1 origin ${{ steps.ggml.outputs.sha }}
          git -C ggml-src checkout -q FETCH_HEAD
          cmake -S ggml-src -B ggml-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=${{ runner.os == 'macOS' && 'ON' || 'OFF' }} \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j4
          cmake --install ggml-src/build

      - name: Configure
        run: |
          cmake -S engines/tts -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTTS_CPP_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"

      - name: Build
        run: cmake --build build -j4

      # Excludes gpu (no usable GPU on hosted runners — see the ggml build
      # note) and perf (timing gates are meaningless on shared runners).
      # Model-dependent tests are DISABLED at configure time when fixtures
      # are absent and report as "Not Run".
      # LD_LIBRARY_PATH: the ggml install ships libqvac-speech-ggml.so whose
      # own dependency on the ggml-cpu/base siblings is resolved transitively
      # — Linux RUNPATH doesn't apply to transitive loads, so the loader
      # needs the directory explicitly (macOS @rpath chains handle it).
      - name: Test (non-GPU)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: ctest --test-dir build -LE 'gpu|perf' --output-on-failure --timeout 600

      # test-metal-ops exits 0 with a "nothing to validate" marker when no
      # Metal device is registered, so a bare green tick would not prove the
      # kernel parity assertions ran. On this lane they must: the runner is
      # real Apple silicon. The marker is treated as a failure, exactly like
      # audiogen-ci.yml's enforced MiniMax Metal step. --no-tests=error
      # closes the other vacuous-pass path: the test registers only when the
      # installed ggml exports a Metal backend, and a zero-match ctest run
      # exits 0 by default.
      - name: Test (Metal kernel parity)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          ctest --test-dir build -R '^test-metal-ops$' --no-tests=error -V --timeout 600 2>&1 | tee metal-test.log
          if grep -q "No Metal device registered" metal-test.log; then
            echo "::error::Metal backend absent on the Apple-silicon runner — the parity suite never ran"
            exit 1
          fi

  # GPU lane stub: opt-in until self-hosted GPU runners exist. Trial outcome
  # (QVAC-22775): hosted macos-14 exposes Metal but its Apple Paravirtual
  # device has no simdgroup matmul — kernel encode aborts with "unsupported
  # op 'MUL_MAT'" — so the gpu label needs real Apple silicon, not hosted
  # macOS.
  gpu:
    needs: runner_names
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    # qvac-ubuntu2204-x64-gpu is the NVIDIA Linux runner the qvac monorepo's
    # benchmark and e2e lanes use (it exposes nvidia-smi there). The generic
    # [self-hosted, gpu] label resolved to an Apple Silicon host with no CUDA
    # toolkit, which cannot run the CUDA arms this lane exists for.
    runs-on: ${{ needs.runner_names.outputs.linux_x64_gpu }}
    timeout-minutes: 90
    steps:
      # Self-hosted runners are persistent, so the previous job's tree can
      # survive into this one (docs/ci/SELF-HOSTED-RUNNERS.md in the qvac
      # monorepo). This job is self-hosted-only, so no hosted-runner guard.
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
      - uses: actions/checkout@v4
      - name: Show what this runner has
        run: |
          uname -a
          nvidia-smi || echo "no NVIDIA driver"
          command -v nvcc && nvcc --version || echo "no CUDA toolkit on PATH"
          ls /usr/local/cuda*/bin/nvcc 2>/dev/null || echo "no /usr/local/cuda*"
          command -v vulkaninfo && vulkaninfo --summary 2>/dev/null | head -20 || echo "no vulkaninfo"
      # GGML_VULKAN=ON is the backend the -L gpu suites primarily target
      # (test_vk_vs_cpu et al); Metal is on by default on Apple hosts.
      # CUDA is added only where a toolkit exists: this label currently
      # resolves to an Apple Silicon host, where requesting it fails the
      # configure outright. The per-backend arms pin the backend they cover
      # via TTS_CPP_GPU_BACKEND, so a host carrying several stays unambiguous.
      # A CPU-only ggml would skip or falsely pass the GPU suites.
      - name: Build ggml + engine (native backends) and run GPU suites
        run: |
          git clone --depth 1 --branch "$GGML_BRANCH" "$GGML_REPO" ggml-src
          CUDA_OPTION=""
          if command -v nvcc >/dev/null 2>&1 || [ -x /usr/local/cuda/bin/nvcc ]; then
            NVCC_PATH=$(command -v nvcc || echo /usr/local/cuda/bin/nvcc)
            CUDA_OPTION="-DGGML_CUDA=ON -DCMAKE_CUDA_COMPILER=$NVCC_PATH"
            echo "CUDA toolkit found at $NVCC_PATH; building the NVIDIA backend as well"
          else
            echo "::notice::no CUDA toolkit on this runner; the CUDA arms cannot run here"
          fi
          # GGML_BUILD_TESTS=OFF as every other ggml build in this repo does:
          # this lane runs the *engine's* ctest suite, never ggml's, so
          # compiling ggml's tests only spends runner time and couples the
          # lane to breakage in code it does not exercise.
          cmake -S ggml-src -B ggml-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_VULKAN=ON \
            $CUDA_OPTION \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j && cmake --install ggml-src/build
          cmake -S engines/tts -B build -DCMAKE_BUILD_TYPE=Release \
            -DTTS_CPP_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"
          cmake --build build -j
      # A fixture-less arm registers DISABLED, so `ctest -L gpu` reports success
      # having run none of them. Name the arms this lane exists to run and say
      # which could not, rather than reporting a bare pass. Reported rather than
      # enforced: no engine's fixtures are available to CI today -- Audio8's and
      # Parler's GPU arms are equally disabled -- so hosting them is a change
      # for the whole repo to make, not for this lane to block on.
      - name: Report which GPU arms are runnable
        run: |
          python3 - <<'CHECK'
          import json, subprocess, sys

          EXPECTED = [
              "test-s3gen-cuda",
              "test-s3gen-vulkan",
              "test-chatterbox-parity-mtl-cuda",
              "test-chatterbox-parity-mtl-vulkan",
          ]

          listing = subprocess.run(
              ["ctest", "--test-dir", "build", "-N", "--show-only=json-v1"],
              capture_output=True, text=True, check=True).stdout
          tests = json.loads(listing)["tests"]

          disabled = {}
          for test in tests:
              properties = {p["name"]: p["value"] for p in test.get("properties", [])}
              disabled[test["name"]] = bool(properties.get("DISABLED"))

          absent = [name for name in EXPECTED if name not in disabled]
          skipped = [name for name in EXPECTED if disabled.get(name)]
          if not absent and not skipped:
              print("all %d GPU arms are runnable" % len(EXPECTED))
              sys.exit(0)

          for name in absent:
              print("::warning::%s is not registered (its backend was not compiled)" % name)
          for name in skipped:
              print("::warning::%s is disabled (its model or reference dump is missing)" % name)
          print("")
          print("These arms did not run. Staging the fixtures and pointing the build")
          print("at them with -DTTS_CPP_TEST_MODEL_DIR and -DTTS_CPP_TEST_REF_DIR")
          print("would enable them:")
          print("  chatterbox-s3gen.gguf       ~1.0 GB   test-s3gen-*")
          print("  chatterbox-s3gen-mtl.gguf   ~1.0 GB   test-chatterbox-parity-mtl-*")
          print("  chatterbox-t3-mtl.gguf      ~330 MB   test-chatterbox-parity-mtl-*")
          print("  artifacts/s3gen-ref/        ~121 MB   test-s3gen-* (dump-s3gen-reference.py)")
          sys.exit(0)
          CHECK

      - name: Run the GPU suites
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: |
          ctest --test-dir build -L gpu --output-on-failure --timeout 1200

