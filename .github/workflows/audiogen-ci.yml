# CI for the audiogen engine (engines/audiogen/ — ACE-Step music generation,
# added alongside the repo reorg QIP that moved engines under engines/).
#
# Scope: build the audiogen-cpp library + its unit tests against
# system ggml (qvac-ext-ggml @ speech — mandatory here: AUDIOGEN_USE_SYSTEM_GGML
# defaults ON and the engine needs the custom snake / col2im_1d ops that live
# on that branch), then run the non-GPU ctest suite on both lanes and the
# weight-free MiniMax Metal parity test on the self-hosted Apple-silicon
# runner. Model-dependent smoke harnesses stay downstream on-device.
name: audiogen CI

on:
  push:
    branches: [master]
    paths:
      - 'engines/audiogen/**'
      - '.github/workflows/audiogen-ci.yml'
  pull_request:
    paths:
      - 'engines/audiogen/**'
      - '.github/workflows/audiogen-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Dedupe per PR and per branch: a re-push or re-dispatch supersedes the
# in-flight run. The guard below previously excluded every event but
# pull_request, so a push or a re-dispatch stacked a second run instead of
# replacing the first.
#
# master is exempt on purpose — pushes to the default branch must not cancel
# each other, or a merged commit ends with no CI verdict.
concurrency:
  group: audiogen-ci-${{ (github.ref == 'refs/heads/master' && github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  GGML_REPO: https://github.com/tetherto/qvac-ext-ggml.git
  GGML_BRANCH: speech # single ggml pin shared with parakeet-ci.yml / tts-ci.yml

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  build-test:
    needs: runner_names
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          # Self-hosted Apple silicon, not hosted macOS. GitHub's hosted macOS
          # runners expose an "Apple Paravirtual device" reporting only
          # MTLGPUFamilyApple5, and ggml gates GGML_OP_MUL_MAT on simdgroup
          # reduction (Apple7+), so no matmul can execute there and the parity
          # test could only ever skip. Same conclusion tts-ci.yml reached in
          # QVAC-22775. This is the runner the qvac monorepo uses for its
          # Metal lanes (integration-test-asr-ggml.yml, cpp-tests-*.yml).
          - os: macos-26
    runs-on: ${{ matrix.os == 'macos-26' && needs.runner_names.outputs.macos_arm64_gpu || needs.runner_names.outputs.ubuntu_2404 }}
    timeout-minutes: 60
    steps:
      # Self-hosted runners are persistent, so a previous run's tree can survive
      # into this one. See docs/ci/SELF-HOSTED-RUNNERS.md in the qvac monorepo.
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - uses: actions/checkout@v4

      - name: Install ccache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else sudo apt-get update -q && sudo apt-get install -y ccache; fi
          fi
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      # Without numpy + gguf the converter test silently drops its real
      # safetensors -> GGUF round-trip cases (@skipUnless) and only the
      # dependency-free classes assert anything. Hosted-only: the persistent
      # self-hosted runner's Python environment is not ours to mutate.
      - name: Install converter-test Python deps (numpy, gguf)
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: python3 -m pip install --user numpy gguf

      - name: Resolve ggml pin (tip of ${{ env.GGML_BRANCH }})
        id: ggml
        run: echo "sha=$(git ls-remote "$GGML_REPO" "refs/heads/$GGML_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache ggml install
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-install
          # Linux remains compatible with the shared portable cache. macOS
          # carries the Metal backend needed by the MiniMax GPU parity test.
          key: ggml-install-${{ runner.os == 'macOS' && 'metal' || 'portable' }}-${{ matrix.os }}-${{ steps.ggml.outputs.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-audiogen-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-audiogen-${{ matrix.os }}-

      # macOS builds with Metal for the parity test; Linux stays portable CPU-only.
      - name: Build ggml (system ggml, qvac-ext-ggml@${{ env.GGML_BRANCH }})
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          # Fetch the exact SHA the cache key was derived from — the branch
          # tip may have advanced since the ls-remote resolution, and a
          # tip-only shallow clone would then silently build (and cache)
          # a different commit than the key claims.
          git init -q ggml-src
          git -C ggml-src remote add origin "$GGML_REPO"
          git -C ggml-src fetch --depth 1 origin ${{ steps.ggml.outputs.sha }}
          git -C ggml-src checkout -q FETCH_HEAD
          cmake -S ggml-src -B ggml-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=${{ runner.os == 'macOS' && 'ON' || 'OFF' }} \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j4
          cmake --install ggml-src/build

      - name: Configure
        run: |
          cmake -S engines/audiogen -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUDIOGEN_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"

      - name: Build
        run: cmake --build build -j4

      # Excludes gpu (no GPU on hosted runners) and perf (timing gates are
      # meaningless on shared runners). LD_LIBRARY_PATH: the ggml install ships
      # libqvac-speech-ggml.so whose dependency on the ggml-cpu/base siblings is
      # resolved transitively — Linux RUNPATH doesn't apply to transitive loads,
      # so the loader needs the directory explicitly (macOS @rpath handles it).
      - name: Test (non-GPU)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: ctest --test-dir build -LE 'gpu|perf' --output-on-failure --timeout 600

      # ctest scores a SKIP (return code 77) as success, so a green tick here
      # would not by itself mean the parity assertions ran. On this lane they
      # must: the runner is real Apple silicon, so Metal is expected to be
      # present AND to support MUL_MAT. Either skip marker means the job proved
      # nothing, and is treated as a failure rather than a pass.
      - name: Test (Metal)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          # -V, not --output-on-failure: the markers below are printed by a test
          # that SKIPS, and --output-on-failure shows output only for failures,
          # so the greps would silently never match.
          ctest --test-dir build -R '^test-minimax-metal-ops$' -V --timeout 600 2>&1 | tee metal-test.log
          if grep -q "SKIP Metal backend is unavailable" metal-test.log; then
            echo "::error::Metal backend absent on the Apple-silicon runner — the parity test never ran"
            exit 1
          fi
          if grep -q "SKIP Metal device cannot run MUL_MAT" metal-test.log; then
            echo "::error::Metal device lacks simdgroup reduction, so MUL_MAT is unsupported — this runner was expected to expose an Apple7+ GPU"
            exit 1
          fi

  # No opt-in GPU job here: audiogen's only gpu-labeled test is the Metal
  # parity check (SKIP_RETURN_CODE 77 without Metal), which the build-test
  # macOS lane already runs — and skip-guards — in its "Test (Metal)" step.
  # On a non-Apple runner `ctest -L gpu` could only ever skip it and report a
  # hollow pass. When audiogen grows a Vulkan/CUDA gpu-labeled test, add the
  # lane back mirroring tts-ci.yml's gpu job (qvac-ubuntu2204-x64-gpu +
  # runnable-arms reporter).

