# CI for the audiogen engine (engines/audiogen/ — ACE-Step music generation,
# added alongside the repo reorg QIP that moved engines under engines/).
#
# Scope: build the audiogen-cpp library + its unit tests against
# system ggml (qvac-fabric-llm.cpp ggml/ at GGML_REF — mandatory here:
# AUDIOGEN_USE_SYSTEM_GGML defaults ON and the engine needs the custom snake /
# col2im_1d ops that live in that tree), then run the non-GPU ctest suite on both lanes and the
# weight-free MiniMax Metal parity test on the self-hosted Apple-silicon
# runner. The macOS lane also requires real ACE-Step and MiniMax generation
# with pinned fixtures; direct invocations fail on skipped coverage.
name: audiogen CI

on:
  push:
    branches: [master]
    paths:
      - 'engines/audiogen/**'
      - 'engines/coreml/**'
      - '.github/workflows/audiogen-ci.yml'
  pull_request:
    paths:
      - 'engines/audiogen/**'
      - 'engines/coreml/**'
      - '.github/workflows/audiogen-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Dedupe per PR and per branch: a re-push or re-dispatch supersedes the
# in-flight run. The guard below previously excluded every event but
# pull_request, so a push or a re-dispatch stacked a second run instead of
# replacing the first.
#
# master is exempt on purpose — pushes to the default branch must not cancel
# each other, or a merged commit ends with no CI verdict.
concurrency:
  group: audiogen-ci-${{ (github.ref == 'refs/heads/master' && github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  GGML_REPO: https://github.com/tetherto/qvac-fabric-llm.cpp.git
  GGML_REF: 3cefcca8107194a372f015b13f27cd1aac301b67 # the fabric ggml pin (qvac-fabric-llm.cpp, ggml/); one pin shared by every lane

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  authorize:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-authorize-self-hosted.yml

  build-test:
    needs: runner_names
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
    runs-on: ${{ needs.runner_names.outputs.ubuntu_2404 }}
    timeout-minutes: 60
    steps:
      # Self-hosted runners are persistent, so a previous run's tree can survive
      # into this one. See docs/ci/SELF-HOSTED-RUNNERS.md in the qvac monorepo.
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - uses: actions/checkout@v4

      - name: Install ccache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else sudo apt-get update -q && sudo apt-get install -y ccache; fi
          fi
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      # Without numpy + gguf the converter test silently drops its real
      # safetensors -> GGUF round-trip cases (@skipUnless) and only the
      # dependency-free classes assert anything. Hosted-only: the persistent
      # self-hosted runner's Python environment is not ours to mutate.
      - name: Install converter-test Python deps (numpy, gguf)
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: python3 -m pip install --user numpy gguf

      - name: Resolve ggml pin (qvac-fabric-llm.cpp@${{ env.GGML_REF }})
        id: ggml
        run: echo "sha=$GGML_REF" >> "$GITHUB_OUTPUT"

      - name: Cache ggml install
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-install
          # Linux remains compatible with the shared portable cache. macOS
          # carries the Metal backend needed by the MiniMax GPU parity test.
          key: ggml-install-${{ runner.os == 'macOS' && 'metal' || 'portable' }}-${{ matrix.os }}-${{ steps.ggml.outputs.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-audiogen-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-audiogen-${{ matrix.os }}-

      # macOS builds with Metal for the parity test; Linux stays portable CPU-only.
      - name: Build ggml (system ggml, qvac-fabric-llm.cpp@${{ env.GGML_REF }})
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          # Fetch exactly the pinned SHA the cache key was derived from.
          git init -q ggml-src
          git -C ggml-src remote add origin "$GGML_REPO"
          git -C ggml-src fetch --depth 1 origin ${{ steps.ggml.outputs.sha }}
          git -C ggml-src checkout -q FETCH_HEAD
          cmake -S ggml-src/ggml -B ggml-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=${{ runner.os == 'macOS' && 'ON' || 'OFF' }} \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j4
          cmake --install ggml-src/build

      # AUDIOGEN_COREML on macOS: the Apple lane builds the Core ML VAE decoder
      # sidecar wrapper and runs the parity test against a staged VAE + exported
      # sidecar (see the "Core ML VAE sidecar" steps below), so the feature is
      # functionally covered on every PR, not just compiled.
      - name: Configure
        run: |
          cmake -S engines/audiogen -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUDIOGEN_BUILD_TESTS=ON \
            ${{ runner.os == 'macOS' && '-DAUDIOGEN_COREML=ON' || '' }} \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"

      - name: Build
        run: cmake --build build -j4

      # Excludes gpu (no GPU on hosted runners) and perf (timing gates are
      # meaningless on shared runners). LD_LIBRARY_PATH: the ggml install ships
      # libqvac-speech-ggml.so whose dependency on the ggml-cpu/base siblings is
      # resolved transitively — Linux RUNPATH doesn't apply to transitive loads,
      # so the loader needs the directory explicitly (macOS @rpath handles it).
      - name: Test (non-GPU)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: ctest --test-dir build -LE 'gpu|perf|coreml-runtime|coreml-toy' --output-on-failure --timeout 600

      # Shared Core ML runtime (engines/coreml): portable scheduler, lifetime
      # and option tests with fake loaders. --no-tests=error fails the step
      # when the test is not registered; the test has no skip path.
      - name: Test (Core ML runtime, portable)
        run: ctest --test-dir build -L coreml-runtime --no-tests=error --output-on-failure --timeout 300

  # Self-hosted Apple silicon, not hosted macOS. GitHub's hosted macOS runners
  # expose an Apple Paravirtual device without simdgroup matmul (QVAC-22775).
  # Job-level `if` cannot see `matrix.os`, so this lane is a separate job
  # gated on fork-ci.
  build-test-macos:
    needs: [runner_names, authorize]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
    timeout-minutes: 180
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .

      - uses: actions/checkout@v4

      - name: Install ccache
        run: echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"

      - name: Resolve ggml pin (qvac-fabric-llm.cpp@${{ env.GGML_REF }})
        id: ggml
        run: echo "sha=$GGML_REF" >> "$GITHUB_OUTPUT"

      - name: Cache ggml install
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-install
          key: ggml-install-metal-macos-26-${{ steps.ggml.outputs.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-audiogen-macos-26-${{ github.sha }}
          restore-keys: ccache-audiogen-macos-26-

      - name: Build ggml (system ggml, qvac-fabric-llm.cpp@${{ env.GGML_REF }})
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          git init -q ggml-src
          git -C ggml-src remote add origin "$GGML_REPO"
          git -C ggml-src fetch --depth 1 origin ${{ steps.ggml.outputs.sha }}
          git -C ggml-src checkout -q FETCH_HEAD
          cmake -S ggml-src/ggml -B ggml-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=ON \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j4
          cmake --install ggml-src/build

      - name: Configure
        run: |
          cmake -S engines/audiogen -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUDIOGEN_BUILD_TESTS=ON \
            -DAUDIOGEN_COREML=ON \
            -DAUDIOGEN_MINIMAX_COREML=ON \
            -DCMAKE_PREFIX_PATH="$PWD/ggml-install"

      - name: Build
        run: cmake --build build -j4

      - name: Test (non-GPU)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ggml-install/lib
        run: ctest --test-dir build -LE 'gpu|perf|coreml-runtime|coreml-toy' --output-on-failure --timeout 600

      # Shared Core ML runtime (engines/coreml): portable scheduler, lifetime
      # and option tests with fake loaders. --no-tests=error fails the step
      # when the test is not registered; the test has no skip path.
      - name: Test (Core ML runtime, portable)
        run: ctest --test-dir build -L coreml-runtime --no-tests=error --output-on-failure --timeout 300

      - name: Test (Metal)
        run: |
          set -o pipefail
          ctest --test-dir build -R '^test-minimax-metal-ops$' -V --timeout 600 2>&1 | tee metal-test.log
          if grep -q "SKIP Metal backend is unavailable" metal-test.log; then
            echo "::error::Metal backend absent on the Apple-silicon runner — the parity test never ran"
            exit 1
          fi
          if grep -q "SKIP Metal device cannot run MUL_MAT" metal-test.log; then
            echo "::error::Metal device lacks simdgroup reduction, so MUL_MAT is unsupported — this runner was expected to expose an Apple7+ GPU"
            exit 1
          fi

      - name: Install Python test dependencies
        run: |
          coreml_python="$(command -v python3.11 || command -v python3)"
          "$coreml_python" -m venv .venv-coreml
          .venv-coreml/bin/python -m pip install -r engines/parakeet/scripts/requirements-coreml.txt

      - name: Test (Core ML Python suites)
        run: |
          .venv-coreml/bin/python engines/audiogen/test/test_export_vae_coreml.py
          .venv-coreml/bin/python engines/audiogen/test/test_export_minimax_conditioner_coreml.py
          .venv-coreml/bin/python engines/audiogen/test/test_minimax_ane_models.py
          .venv-coreml/bin/python engines/audiogen/test/test_minimax_ane_export.py
          .venv-coreml/bin/python engines/audiogen/test/test_convert_minimax_roundtrip.py
          .venv-coreml/bin/python engines/audiogen/test/test_minimax_ane_cli.py --executable build/mm3-replay

      - name: Stage generation fixtures
        run: |
          .venv-coreml/bin/python engines/audiogen/scripts/prepare-ci-models.py \
            --cache-dir "$HOME/.cache/qvac-audiogen-ci-models" \
            --build-dir "$PWD/build" --output-env "$GITHUB_ENV"

      - name: Test (real generation and fit)
        env:
          AUDIOGEN_TEST_GPU: '1'
          MM3_DEVICE: gpu
        run: |
          ./build/test-acestep-integration
          ./build/test-acestep-fit-params
          ./build/test-minimax-integration
          ./build/test-minimax-fit-models
          ./build/test-minimax-quality
          ./build/test-minimax-quality --q4

      - name: Cache Core ML VAE fixture
        id: coreml-fixture-cache
        uses: actions/cache@v4
        with:
          path: |
            coreml-fixture
            coreml-fixture-p8
          key: acestep-vae-coreml-${{ runner.os }}-${{ runner.arch }}-0599862a-${{ hashFiles('engines/audiogen/scripts/export-vae-coreml.py', 'engines/audiogen/test/test_export_vae_coreml.py', 'engines/parakeet/scripts/requirements-coreml.txt') }}

      - name: Build Core ML VAE fixture
        if: steps.coreml-fixture-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p coreml-fixture coreml-fixture-p8
          curl -sSfL --retry 3 -o coreml-fixture/vae-BF16.gguf \
            https://huggingface.co/Serveurperso/ACE-Step-1.5-GGUF/resolve/9b3707625776cc4cf775e9b12ab82f9fe48335ff/vae-BF16.gguf
          echo "0599862ac5d15cd308e1d2e368373aea6c02e25ebd1737ad4a4562a0901b0ef8  coreml-fixture/vae-BF16.gguf" | shasum -a 256 -c -
          .venv-coreml/bin/python engines/audiogen/scripts/export-vae-coreml.py \
            --gguf coreml-fixture/vae-BF16.gguf \
            --out coreml-fixture/vae-decoder.mlpackage --compile-dir coreml-fixture
          rm -rf coreml-fixture/vae-decoder.mlpackage
          .venv-coreml/bin/python engines/audiogen/scripts/export-vae-coreml.py \
            --gguf coreml-fixture/vae-BF16.gguf --palettize 8 \
            --out coreml-fixture-p8/vae-decoder.mlpackage --compile-dir coreml-fixture-p8
          rm -rf coreml-fixture-p8/vae-decoder.mlpackage

      - name: Test (Core ML VAE sidecar)
        env:
          AUDIOGEN_TEST_MODELS_DIR: ${{ github.workspace }}/coreml-fixture
        run: ./build/test-vae-coreml-parity

      - name: Test (Core ML VAE sidecar, 8-bit palettized)
        env:
          AUDIOGEN_TEST_MODELS_DIR: ${{ github.workspace }}/coreml-fixture-p8
        run: |
          ln -sf "$GITHUB_WORKSPACE/coreml-fixture/vae-BF16.gguf" coreml-fixture-p8/vae-BF16.gguf
          ./build/test-vae-coreml-parity

      - name: Benchmark (Core ML VAE vs Metal)
        run: |
          set -euo pipefail
          AUDIOGEN_TEST_MODELS_DIR="$GITHUB_WORKSPACE/coreml-fixture" \
            ./build/bench-vae-coreml >> "$GITHUB_STEP_SUMMARY"
          echo "(float16 sidecar above; 8-bit palettized below)" >> "$GITHUB_STEP_SUMMARY"
          AUDIOGEN_TEST_MODELS_DIR="$GITHUB_WORKSPACE/coreml-fixture-p8" \
            ./build/bench-vae-coreml >> "$GITHUB_STEP_SUMMARY"

      # The ACE-Step VAE decoder generated from vae-BF16.gguf by the shared
      # Core ML runtime (template acestep-vae-t64): G3, the exporter on the
      # real GGUF against the generator, every blob within the template's
      # tolerance; then G4, test-vae-coreml-parity on the generated route from
      # an empty cache (the GGUF linked into a directory with no prebuilt
      # sidecar), strict, cosine >= 0.999 against the ggml decode, and a
      # second owner adopting the published artifact. The test fails on any
      # skip path: --cache-dir with a prebuilt next to the GGUF, or a route
      # that is not generate, is a failure.
      - name: Test (Core ML VAE generated sidecar, staged vae-BF16.gguf)
        id: acestep-vae-generated
        run: |
          set -euo pipefail
          sw_vers
          .venv-coreml/bin/python engines/coreml/python/coreml_template.py --tool build/qvac-coreml-tool real \
            --template-dir engines/audiogen/coreml-templates/acestep-vae-t64 --gguf coreml-fixture/vae-BF16.gguf
          rm -rf acestep-vae-gen
          mkdir -p acestep-vae-gen/models
          ln -s "$GITHUB_WORKSPACE/coreml-fixture/vae-BF16.gguf" acestep-vae-gen/models/vae-BF16.gguf
          AUDIOGEN_TEST_MODELS_DIR="$PWD/acestep-vae-gen/models" \
            ./build/test-vae-coreml-parity --cache-dir "$PWD/acestep-vae-gen/cache"
          rm -rf acestep-vae-gen

      # The low-memory semantics on the staged generation models, each case
      # on an empty cache: an encoding starts no decoder job; three
      # generate() calls (the first decodes on ggml while the cold load is
      # held at its completion until after its eviction, then writes its hint
      # without repopulating the slot; the second and third reload warm and
      # decode on Core ML); a second process's first decode on that primed
      # cache runs on Core ML; cancelled decodes (pending, ready, waiting,
      # strict) leave the slot idle and start no ggml decode; a warm repaint
      # releases the decoder before its encode; {prewarm all} with and without
      # wait construct succeeds with no decoder retained, and an engine
      # destroyed while that release is held returns at once;
      # Engine::coreml_prewarm on an idle engine succeeds and releases the
      # decoder; an eviction cancels an unstarted job; a latent shorter than
      # the decoder's window decodes on ggml, not pending, on a ready slot;
      # memory-degrade follows the caller's decision. Fit (route and whole projection) is
      # the same on an empty cache, on one holding a simulated generation in
      # the runtime's layout with a non-stale and then a stale hint, and on the
      # cache the three generations really populated (its compiled artifact
      # and the hint its load wrote). --require-coreml turns every skip into a
      # failure.
      - name: Test (Core ML VAE low-memory mode and fit, staged models)
        if: >-
          !cancelled() &&
          (steps.acestep-vae-generated.outcome == 'success' || steps.acestep-vae-generated.outcome == 'failure')
        env:
          AUDIOGEN_TEST_GPU: '1'
        run: |
          set -euo pipefail
          rm -rf acestep-vae-lowmem
          mkdir -p acestep-vae-lowmem
          ./build/test-acestep-vae-coreml --models "$AUDIOGEN_TEST_MODELS_DIR" \
            --cache-root "$PWD/acestep-vae-lowmem" --require-coreml --fit-stable
          rm -rf acestep-vae-lowmem

      # The memory validation behind the acestep-vae-t64 memory constants, on
      # this runner's chip: ggml VAE decodes run while the decoder is
      # generated, compiled, loaded and warmed in the background, three times
      # to completion (early completion, then a stage-boundary eviction) and
      # twice evicted while loading (late completion: the load finishes after
      # the eviction, writes its hint and releases its model), each from a
      # re-signed copy of the test and an empty cache, so every Neural Engine
      # load is cold. Each run prints its per-phase table and a one-line JSON
      # report and fails when a phase exceeds the constant that charges it
      # (a late run's load, warm-up and post-eviction samples are held, over
      # the warmed ggml-only baseline, to the transient charge; a failed
      # footprint or compiler query, no compiler reading during the load or
      # a failed ggml decode fails the run). ANECompilerService is
      # held by its absolute size while loading, which includes what other
      # jobs on this runner's Mac compiled: the reserve is set from that
      # absolute size, since growth over a service that already holds memory
      # understates a cold compile. Known failure mode: a co-hosted job
      # compiling for the Neural Engine during the load raises that size; it
      # shows as one run far above the others; rerun the job.
      - name: Memory schedule (generated ACE-Step VAE decoder, overlapped, this runner)
        if: >-
          !cancelled() &&
          (steps.acestep-vae-generated.outcome == 'success' || steps.acestep-vae-generated.outcome == 'failure')
        run: |
          set -euo pipefail
          sysctl -n machdep.cpu.brand_string hw.memsize
          rm -rf acestep-vae-memory
          mkdir -p acestep-vae-memory/models
          # No prebuilt sidecar next to this GGUF: the generated route.
          ln -s "$GITHUB_WORKSPACE/coreml-fixture/vae-BF16.gguf" acestep-vae-memory/models/vae-BF16.gguf
          status=0
          for run in early:1 early:2 early:3 late:1 late:2; do
            kind="${run%%:*}"
            i="${run##*:}"
            id="qvac-memory-$(uuidgen)"
            cp build/test-acestep-vae-coreml "acestep-vae-memory/$id"
            codesign -s - -f -i "$id" "acestep-vae-memory/$id"
            late_flag=""
            if [ "$kind" = late ]; then late_flag="--late"; fi
            "acestep-vae-memory/$id" --vae acestep-vae-memory/models/vae-BF16.gguf \
              --memory-schedule "$PWD/acestep-vae-memory/cache-$kind-$i" --require-coreml $late_flag || status=1
            rm -rf "acestep-vae-memory/cache-$kind-$i" "acestep-vae-memory/$id" "$HOME/Library/Caches/$id"
          done
          rm -rf acestep-vae-memory
          exit "$status"

  # No opt-in GPU job here: audiogen's only gpu-labeled test is the Metal
  # parity check (SKIP_RETURN_CODE 77 without Metal), which the build-test
  # macOS lane already runs — and skip-guards — in its "Test (Metal)" step.
  # On a non-Apple runner `ctest -L gpu` could only ever skip it and report a
  # hollow pass. When audiogen grows a Vulkan/CUDA gpu-labeled test, add the
  # lane back mirroring tts-ci.yml's gpu job (qvac-ubuntu2204-x64-gpu +
  # runnable-arms reporter).

