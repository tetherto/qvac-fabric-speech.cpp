# Core ML generation templates: the extraction and cross-seed gates and
# the generator tripwire, on the self-hosted Apple-silicon
# lane with the coremltools venv pinned by
# engines/parakeet/scripts/requirements-coreml.txt.
#
# For every engines/*/coreml-templates/<id>/ in the tree,
# engines/coreml/python/coreml_template.py report runs the template's
# unchanged exporter on random production-geometry twins (A and B in f32,
# Q quantised and dequantised by ggml for the exporter) and compares the
# exporter's weight.bin, blob by blob, with the one the C++ generator writes
# from the same twin (qvac-coreml-tool verify), and the exporter's spec with
# the template's. golden.py check regenerates each template's weight.bin from
# twin A and compares it with engines/coreml/test/golden.txt.
#
# Path-filtered: the exporters, the templates, the shared runtime and the venv
# pin. Some exporters (Chatterbox CFM) take minutes per conversion.
name: Core ML templates CI

on:
  push:
    branches: [master]
    paths:
      - 'engines/coreml/**'
      - 'engines/*/coreml-templates/**'
      - 'engines/*/scripts/export-*-coreml.py'
      - 'engines/*/scripts/**/export-*-coreml.py'
      - 'engines/parakeet/scripts/requirements-coreml.txt'
      - '.github/workflows/coreml-templates-ci.yml'
  pull_request:
    paths:
      - 'engines/coreml/**'
      - 'engines/*/coreml-templates/**'
      - 'engines/*/scripts/export-*-coreml.py'
      - 'engines/*/scripts/**/export-*-coreml.py'
      - 'engines/parakeet/scripts/requirements-coreml.txt'
      - '.github/workflows/coreml-templates-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreml-templates-ci-${{ (github.ref == 'refs/heads/master' && github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  GGML_REPO: https://github.com/tetherto/qvac-ext-ggml.git
  GGML_BRANCH: speech # single ggml pin shared with tts-ci.yml and parakeet-ci.yml

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  authorize:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-authorize-self-hosted.yml

  gates:
    name: template gates
    needs: [runner_names, authorize]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
    timeout-minutes: 90
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .

      - uses: actions/checkout@v4

      - name: Resolve ggml pin (tip of ${{ env.GGML_BRANCH }})
        id: ggml
        run: echo "sha=$(git ls-remote "$GGML_REPO" "refs/heads/$GGML_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Same install and key as tts-ci.yml build-test-macos.
      - name: Cache ggml install
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-install
          key: ggml-install-metal-macos-26-${{ steps.ggml.outputs.sha }}

      - name: Build ggml (system ggml, qvac-ext-ggml@${{ env.GGML_BRANCH }})
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          git init -q ggml-src
          git -C ggml-src remote add origin "$GGML_REPO"
          git -C ggml-src fetch --depth 1 origin ${{ steps.ggml.outputs.sha }}
          git -C ggml-src checkout -q FETCH_HEAD
          cmake -S ggml-src -B ggml-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=ON \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/ggml-install"
          cmake --build ggml-src/build -j4
          cmake --install ggml-src/build

      - name: Build qvac-coreml-tool
        run: |
          cmake -S engines/coreml -B build-coreml -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/ggml-install"
          cmake --build build-coreml --target qvac-coreml-tool -j4
          echo "QVAC_COREML_TOOL=$PWD/build-coreml/qvac-coreml-tool" >> "$GITHUB_ENV"

      - name: Install the pinned coremltools venv
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sw_vers
          coreml_python="$(command -v python3.11 || command -v python3)"
          "$coreml_python" -m venv .venv-coreml-templates
          .venv-coreml-templates/bin/python -m pip install -r engines/parakeet/scripts/requirements-coreml.txt

      # coreml_template.py's own checks, including `suggest` on the toy
      # exporter. QVAC_COREML_REQUIRE_COREMLTOOLS turns a missing requirement
      # into a failure instead of a skip.
      - name: coreml_template.py unit checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          QVAC_COREML_REQUIRE_COREMLTOOLS: '1'
        run: |
          set -o pipefail
          .venv-coreml-templates/bin/python -B engines/coreml/python/test_coreml_template.py 2>&1 | tee template-py.log
          if grep -q "skipped" template-py.log; then
            echo "::error::a coreml_template.py check was skipped"
            exit 1
          fi

      # The harness on the test-only toy templates (routing fixtures, not a
      # gate on any model): extract reproduced, exporter and generator agree.
      - name: Harness self-check (toy templates)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          .venv-coreml-templates/bin/python -B engines/coreml/python/coreml_template.py report \
            --template-dir engines/coreml/test/toy-templates/toy-stateless \
            --template-dir engines/coreml/test/toy-templates/toy-multi \
            --template-dir engines/coreml/test/toy-templates/toy-state

      - name: Extraction and cross-seed gates (every template in the tree)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          .venv-coreml-templates/bin/python -B engines/coreml/python/coreml_template.py report \
            --all --allow-empty --json template-gates.json

      - name: Generator tripwire (golden.txt)
        run: python3 -B engines/coreml/python/golden.py check --tool "$QVAC_COREML_TOOL"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-template-gates
          path: |
            template-gates.json
            template-py.log
          if-no-files-found: ignore
